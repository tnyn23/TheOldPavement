name: Deploy to MonsterASP

on:
  push:
    branches:
      - main # Change this to your default branch if it's not 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Make sure this matches your project's .NET version

    - name: Restore dependencies
      run: dotnet restore TheOldPavement.sln

    - name: Build and Publish
      run: dotnet publish src/Web/Web.csproj -c Release -o ./publish_output

    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish_output/
        server-dir: /wwwroot/
        dangerous-clean-slate: false # Set to true ONLY if you want FTP to delete files on the server that aren't in your code
